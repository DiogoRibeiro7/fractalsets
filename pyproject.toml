[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fractalsets"
version = "1.0.0"
description = "Comprehensive Python package for fractal generation and visualization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Diogo Ribeiro", email = "dfr@esmad.ipp.pt"}
]
keywords = ["fractal", "mandelbrot", "julia", "mathematics", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
    "Pillow>=8.0.0",
]

[project.optional-dependencies]
performance = ["numba>=0.54.0"]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=21.0",
    "flake8>=3.9",
    "sphinx>=4.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/fractalsets"
Documentation = "https://fractalsets.readthedocs.io"
Repository = "https://github.com/yourusername/fractalsets"
"Bug Tracker" = "https://github.com/yourusername/fractalsets/issues"

[project.scripts]
fractalsets-demo = "fractalsets.examples.advanced_examples:run_all_examples"
fractalsets-gallery = "fractalsets.examples.gallery:FractalGallery.showcase"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=fractalsets --cov-report=html --cov-report=term"

[tool.coverage.run]
source = ["fractalsets"]
omit = ["*/tests/*", "*/examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
